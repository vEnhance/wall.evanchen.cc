<!DOCTYPE html>
<html lang="{{ lang }}">
    <head>
        <meta charset="utf-8">
        <meta name="description" content="{{ config.description }}" />
        <title>{% block title %}{{ config.title }}{% endblock title %}</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Coming+Soon&family=Quicksand:wght@300..700&family=Shadows+Into+Light&display=swap"
              rel="stylesheet">
        <link rel="stylesheet"
              href="{{ get_url(path='main.css', cachebust=true) }}">
        <link rel="stylesheet"
              href="https://cdn.jsdelivr.net/npm/katex/dist/katex.min.css"
              crossorigin="anonymous">
        <meta name="viewport" content="width=device-width, initial-scale=1">
    </head>
    <body>
        <div class="wrapper">
            <header>
                <div class="title">
                    <a href="/">{{ config.title }}</a>
                </div>
                <div class="sub-title">{{ config.description }}</div>
                <p class="view">
                    <a href="{{ get_url(path='@/_index.md') }}">Wall</a>
                    •
                    <a href="{{ get_url(path='@/fixed/about.md') }}">About</a>
                    •
                    <a href="{{ get_url(path='@/fixed/log.md') }}">Log</a>
                    •
                    <a href="{{ get_url(path='@/fixed/live.md') }}">Live feed</a>
                </p>
            </header>
            <section>
                {% block content %}
                {% endblock content %}
            </section>
            <footer>
                <p>
                    <a href="{{ get_url(path='@/fixed/about.md') }}">
                        <img src="/images/wall-sm.png"
                             alt="A picture of wall"
                             width="128"
                             height="128" />
                    </a>
                </p>
                <p>
                    <a href="https://list.evanchen.cc">Mail list</a>
                    •
                    <a href="{{ get_url(path='atom.xml') }}">Atom feed</a>
                    •
                    <a href="https://github.com/vEnhance/wall.evanchen.cc/">Git repo</a>
                    <br />
                    Generated with <a href="https://www.getzola.org/">Zola</a>
                    <br />
                    Theme based on Sundown by <a href="https://github.com/orderedlist">orderedlist</a>
                </p>
            </footer>
        </div>
        <script defer src="{{ get_url(path='random_link.js', cachebust=true) }}"></script>
        <script defer
                src="https://cdn.jsdelivr.net/npm/katex/dist/katex.min.js"
                crossorigin="anonymous"></script>
        <script defer
                src="https://cdn.jsdelivr.net/npm/katex/dist/contrib/auto-render.min.js"
                crossorigin="anonymous"
                onload="renderMathInElement(document.body, { delimiters: [ {left: '$$', right: '$$', display: true}, {left: '$', right: '$', inline: true} ] });"></script>
    </body>
</html>
