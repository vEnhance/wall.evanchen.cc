{% extends "base.html" %}
{% block content %}
    {{ <page_nav paginator={paginator} /> }}
    {% for page in paginator.pages %}
        <h5>{{ <post_link post={page} /> }} by {{ config.author }}</h5>
        {{ page.content | safe }}
        <hr />
    {% endfor %}
    {{ <page_nav paginator={paginator} /> }}
{% endblock content %}
