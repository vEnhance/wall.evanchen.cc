{% extends "base.html" %}
{% block title %}
    #{{ page.slug }} | {{ config.title }}
{% endblock title %}
{% block content %}
    {{ <post_nav page={page} /> }}
    <article>
        <h2>{{ <post_link post={page} /> }} by {{ config.author }}</h2>
        {{ page.content | safe }}
    </article>
    <p class="source-link">
        <a href="https://github.com/vEnhance/wall.evanchen.cc/blob/main/content/{{ page.relative_path }}?plain=1">View as Markdown</a>
    </p>
{% endblock content %}
