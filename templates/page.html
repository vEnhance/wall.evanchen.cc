{% extends "base.html" %}
{% block title %}
    #{{ page.slug }} | {{ config.title }}
{% endblock title %}
{% block content %}
    <section id="content" class="body">
        <article>
            <div class="entry-content">
                <h5>
                    <a href="{{ page.permalink }}" rel="bookmark">#{{ page.slug }}
                        —
                        <abbr class="published"
                              title="{{ page.date | date(format='%Y-%m-%dT%H:%M:%SZ') }}">
                            {{ page.date | date(format="%B %-d, %Y") }}
                        </abbr>
                    </a>
                    by {{ config.author }}
                </h5>
                {{ page.content | safe }}
            </div>
            <!-- /.entry-content -->
        </article>
    </section>
{% endblock content %}
